<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Fluid Pendant</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #container {
            position: relative;
            width: 450px;
            height: 450px;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
        }
        
        #pendant {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(145deg, #c9a961, #a88f4f);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4),
                        inset 0 -8px 20px rgba(0,0,0,0.4),
                        inset 0 8px 20px rgba(255,255,255,0.2);
            cursor: grab;
            padding: 30px;
            box-sizing: border-box;
        }
        
        #pendant:active {
            cursor: grabbing;
        }
        
        #ledDisplay {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0a0a0a;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }
        
        .led {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #0f0f0f;
            transition: all 0.1s ease-out;
        }
        
        #ring {
            position: absolute;
            width: 50px;
            height: 50px;
            background: linear-gradient(145deg, #c9a961, #8a7340);
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5),
                        inset 0 -3px 8px rgba(0,0,0,0.4),
                        inset 0 3px 8px rgba(255,255,255,0.3);
            right: -15px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
        }
        
        #ring::before {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            background: transparent;
            border: 4px solid #a88f4f;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 12px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 15px 25px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        button {
            background: linear-gradient(145deg, #4a4a4a, #2a2a2a);
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: linear-gradient(145deg, #5a5a5a, #3a3a3a);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    
    <div id="controls">
        <button id="pauseBtn"></button>
        <button id="resetBtn"></button>
    </div>
    
    <div id="container">
        <div id="pendant">
            <div id="ledDisplay"></div>
            <div id="ring"></div>
        </div>
    </div>

    <script>
        const ledDisplay = document.getElementById('ledDisplay');
        const pendant = document.getElementById('pendant');
        
        const LED_COUNT = 216;
        const leds = [];
        
        let rotation = 0;
        let angularVelocity = 0;
        let isDragging = false;
        let lastMouseAngle = 0;
        
        function createLEDGrid() {
            const displaySize = ledDisplay.offsetWidth;
            const centerX = displaySize / 2;
            const centerY = displaySize / 2;
            const maxRadius = displaySize / 2 - 15;
            
            const rings = [
                { count: 1, radius: 0 },
                { count: 8, radius: 0.15 },
                { count: 16, radius: 0.30 },
                { count: 24, radius: 0.45 },
                { count: 32, radius: 0.60 },
                { count: 40, radius: 0.75 },
                { count: 48, radius: 0.88 },
                { count: 47, radius: 0.98 }
            ];
            
            rings.forEach(ring => {
                const r = ring.radius * maxRadius;
                const count = ring.count;
                
                for (let i = 0; i < count && leds.length < LED_COUNT; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const x = centerX + Math.cos(angle) * r;
                    const y = centerY + Math.sin(angle) * r;
                    
                    const led = document.createElement('div');
                    led.className = 'led';
                    led.style.left = (x - 3.5) + 'px';
                    led.style.top = (y - 3.5) + 'px';
                    ledDisplay.appendChild(led);
                    
                    leds.push({
                        element: led,
                        x: x,
                        y: y,
                        displayX: x,
                        displayY: y
                    });
                }
            });
            
            console.log('Створено LED:', leds.length);
        }
        
        const simHeight = 3.0;
        const simWidth = 3.0;
        
        const FLUID_CELL = 0;
        const AIR_CELL = 1;
        const SOLID_CELL = 2;
        
        function clamp(x, min, max) {
            if (x < min) return min;
            else if (x > max) return max;
            else return x;
        }
        
        class FlipFluid {
            constructor(density, width, height, spacing, particleRadius, maxParticles) {
                this.density = density;
                this.fNumX = Math.floor(width / spacing) + 1;
                this.fNumY = Math.floor(height / spacing) + 1;
                this.h = Math.max(width / this.fNumX, height / this.fNumY);
                this.fInvSpacing = 1.0 / this.h;
                this.fNumCells = this.fNumX * this.fNumY;
                
                this.u = new Float32Array(this.fNumCells);
                this.v = new Float32Array(this.fNumCells);
                this.du = new Float32Array(this.fNumCells);
                this.dv = new Float32Array(this.fNumCells);
                this.prevU = new Float32Array(this.fNumCells);
                this.prevV = new Float32Array(this.fNumCells);
                this.p = new Float32Array(this.fNumCells);
                this.s = new Float32Array(this.fNumCells);
                this.cellType = new Int32Array(this.fNumCells);
                
                this.maxParticles = maxParticles;
                this.particlePos = new Float32Array(2 * this.maxParticles);
                this.particleVel = new Float32Array(2 * this.maxParticles);
                this.particleDensity = new Float32Array(this.fNumCells);
                this.particleRestDensity = 0.0;
                
                this.particleRadius = particleRadius;
                this.pInvSpacing = 1.0 / (2.2 * particleRadius);
                this.pNumX = Math.floor(width * this.pInvSpacing) + 1;
                this.pNumY = Math.floor(height * this.pInvSpacing) + 1;
                this.pNumCells = this.pNumX * this.pNumY;
                
                this.numCellParticles = new Int32Array(this.pNumCells);
                this.firstCellParticle = new Int32Array(this.pNumCells + 1);
                this.cellParticleIds = new Int32Array(maxParticles);
                this.numParticles = 0;
            }
            
            integrateParticles(dt, gravity) {
                const gravityX = gravity * Math.sin(rotation);
                const gravityY = gravity * Math.cos(rotation);
                
                for (let i = 0; i < this.numParticles; i++) {
                    this.particleVel[2 * i] += dt * gravityX;
                    this.particleVel[2 * i + 1] += dt * gravityY;
                    this.particlePos[2 * i] += this.particleVel[2 * i] * dt;
                    this.particlePos[2 * i + 1] += this.particleVel[2 * i + 1] * dt;
                }
            }
            
            handleParticleCollisions() {
                const h = 1.0 / this.fInvSpacing;
                const r = this.particleRadius;
                const centerX = (this.fNumX * h) / 2;
                const centerY = (this.fNumY * h) / 2;
                const circleRadius = Math.min(centerX, centerY) - h * 1.5;
                
                for (let i = 0; i < this.numParticles; i++) {
                    let x = this.particlePos[2 * i];
                    let y = this.particlePos[2 * i + 1];
                    
                    const dx = x - centerX;
                    const dy = y - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist > circleRadius - r) {
                        const angle = Math.atan2(dy, dx);
                        x = centerX + Math.cos(angle) * (circleRadius - r);
                        y = centerY + Math.sin(angle) * (circleRadius - r);
                        
                        const nx = Math.cos(angle);
                        const ny = Math.sin(angle);
                        const vn = this.particleVel[2 * i] * nx + this.particleVel[2 * i + 1] * ny;
                        this.particleVel[2 * i] -= 1.5 * vn * nx;
                        this.particleVel[2 * i + 1] -= 1.5 * vn * ny;
                    }
                    
                    this.particlePos[2 * i] = x;
                    this.particlePos[2 * i + 1] = y;
                }
            }
            
            updateParticleDensity() {
                const n = this.fNumY;
                const h = this.h;
                const h1 = this.fInvSpacing;
                const h2 = 0.5 * h;
                
                this.particleDensity.fill(0.0);
                
                for (let i = 0; i < this.numParticles; i++) {
                    const x = clamp(this.particlePos[2 * i], h, (this.fNumX - 1) * h);
                    const y = clamp(this.particlePos[2 * i + 1], h, (this.fNumY - 1) * h);
                    
                    const x0 = Math.floor((x - h2) * h1);
                    const tx = ((x - h2) - x0 * h) * h1;
                    const x1 = Math.min(x0 + 1, this.fNumX - 2);
                    
                    const y0 = Math.floor((y - h2) * h1);
                    const ty = ((y - h2) - y0 * h) * h1;
                    const y1 = Math.min(y0 + 1, this.fNumY - 2);
                    
                    const sx = 1.0 - tx;
                    const sy = 1.0 - ty;
                    
                    if (x0 < this.fNumX && y0 < this.fNumY) this.particleDensity[x0 * n + y0] += sx * sy;
                    if (x1 < this.fNumX && y0 < this.fNumY) this.particleDensity[x1 * n + y0] += tx * sy;
                    if (x1 < this.fNumX && y1 < this.fNumY) this.particleDensity[x1 * n + y1] += tx * ty;
                    if (x0 < this.fNumX && y1 < this.fNumY) this.particleDensity[x0 * n + y1] += sx * ty;
                }
                
                if (this.particleRestDensity == 0.0) {
                    let sum = 0.0;
                    let numFluidCells = 0;
                    for (let i = 0; i < this.fNumCells; i++) {
                        if (this.cellType[i] == FLUID_CELL) {
                            sum += this.particleDensity[i];
                            numFluidCells++;
                        }
                    }
                    if (numFluidCells > 0)
                        this.particleRestDensity = sum / numFluidCells;
                }
            }
            
            transferVelocities(toGrid, flipRatio) {
                const n = this.fNumY;
                const h = this.h;
                const h1 = this.fInvSpacing;
                const h2 = 0.5 * h;
                
                if (toGrid) {
                    this.prevU.set(this.u);
                    this.prevV.set(this.v);
                    this.du.fill(0.0);
                    this.dv.fill(0.0);
                    this.u.fill(0.0);
                    this.v.fill(0.0);
                    
                    for (let i = 0; i < this.fNumCells; i++)
                        this.cellType[i] = this.s[i] == 0.0 ? SOLID_CELL : AIR_CELL;
                    
                    for (let i = 0; i < this.numParticles; i++) {
                        const x = this.particlePos[2 * i];
                        const y = this.particlePos[2 * i + 1];
                        const xi = clamp(Math.floor(x * h1), 0, this.fNumX - 1);
                        const yi = clamp(Math.floor(y * h1), 0, this.fNumY - 1);
                        const cellNr = xi * n + yi;
                        if (this.cellType[cellNr] == AIR_CELL)
                            this.cellType[cellNr] = FLUID_CELL;
                    }
                }
                
                for (let component = 0; component < 2; component++) {
                    const dx = component == 0 ? 0.0 : h2;
                    const dy = component == 0 ? h2 : 0.0;
                    const f = component == 0 ? this.u : this.v;
                    const prevF = component == 0 ? this.prevU : this.prevV;
                    const d = component == 0 ? this.du : this.dv;
                    
                    for (let i = 0; i < this.numParticles; i++) {
                        const x = clamp(this.particlePos[2 * i], h, (this.fNumX - 1) * h);
                        const y = clamp(this.particlePos[2 * i + 1], h, (this.fNumY - 1) * h);
                        
                        const x0 = Math.min(Math.floor((x - dx) * h1), this.fNumX - 2);
                        const tx = ((x - dx) - x0 * h) * h1;
                        const x1 = Math.min(x0 + 1, this.fNumX - 2);
                        
                        const y0 = Math.min(Math.floor((y - dy) * h1), this.fNumY - 2);
                        const ty = ((y - dy) - y0 * h) * h1;
                        const y1 = Math.min(y0 + 1, this.fNumY - 2);
                        
                        const sx = 1.0 - tx;
                        const sy = 1.0 - ty;
                        
                        const d0 = sx * sy;
                        const d1 = tx * sy;
                        const d2 = tx * ty;
                        const d3 = sx * ty;
                        
                        const nr0 = x0 * n + y0;
                        const nr1 = x1 * n + y0;
                        const nr2 = x1 * n + y1;
                        const nr3 = x0 * n + y1;
                        
                        if (toGrid) {
                            const pv = this.particleVel[2 * i + component];
                            f[nr0] += pv * d0; d[nr0] += d0;
                            f[nr1] += pv * d1; d[nr1] += d1;
                            f[nr2] += pv * d2; d[nr2] += d2;
                            f[nr3] += pv * d3; d[nr3] += d3;
                        } else {
                            const offset = component == 0 ? n : 1;
                            const valid0 = this.cellType[nr0] != AIR_CELL || this.cellType[nr0 - offset] != AIR_CELL ? 1.0 : 0.0;
                            const valid1 = this.cellType[nr1] != AIR_CELL || this.cellType[nr1 - offset] != AIR_CELL ? 1.0 : 0.0;
                            const valid2 = this.cellType[nr2] != AIR_CELL || this.cellType[nr2 - offset] != AIR_CELL ? 1.0 : 0.0;
                            const valid3 = this.cellType[nr3] != AIR_CELL || this.cellType[nr3 - offset] != AIR_CELL ? 1.0 : 0.0;
                            
                            const v = this.particleVel[2 * i + component];
                            const dSum = valid0 * d0 + valid1 * d1 + valid2 * d2 + valid3 * d3;
                            
                            if (dSum > 0.0) {
                                const picV = (valid0 * d0 * f[nr0] + valid1 * d1 * f[nr1] + valid2 * d2 * f[nr2] + valid3 * d3 * f[nr3]) / dSum;
                                const corr = (valid0 * d0 * (f[nr0] - prevF[nr0]) + valid1 * d1 * (f[nr1] - prevF[nr1]) +
                                    valid2 * d2 * (f[nr2] - prevF[nr2]) + valid3 * d3 * (f[nr3] - prevF[nr3])) / dSum;
                                const flipV = v + corr;
                                this.particleVel[2 * i + component] = (1.0 - flipRatio) * picV + flipRatio * flipV;
                            }
                        }
                    }
                    
                    if (toGrid) {
                        for (let i = 0; i < f.length; i++) {
                            if (d[i] > 0.0) f[i] /= d[i];
                        }
                        
                        for (let i = 0; i < this.fNumX; i++) {
                            for (let j = 0; j < this.fNumY; j++) {
                                const solid = this.cellType[i * n + j] == SOLID_CELL;
                                if (solid || (i > 0 && this.cellType[(i - 1) * n + j] == SOLID_CELL))
                                    this.u[i * n + j] = this.prevU[i * n + j];
                                if (solid || (j > 0 && this.cellType[i * n + j - 1] == SOLID_CELL))
                                    this.v[i * n + j] = this.prevV[i * n + j];
                            }
                        }
                    }
                }
            }
            
            solveIncompressibility(numIters, dt, overRelaxation, compensateDrift) {
                this.p.fill(0.0);
                this.prevU.set(this.u);
                this.prevV.set(this.v);
                
                const n = this.fNumY;
                const cp = this.density * this.h / dt;
                
                for (let iter = 0; iter < numIters; iter++) {
                    for (let i = 1; i < this.fNumX - 1; i++) {
                        for (let j = 1; j < this.fNumY - 1; j++) {
                            if (this.cellType[i * n + j] != FLUID_CELL) continue;
                            
                            const center = i * n + j;
                            const left = (i - 1) * n + j;
                            const right = (i + 1) * n + j;
                            const bottom = i * n + j - 1;
                            const top = i * n + j + 1;
                            
                            const sx0 = this.s[left];
                            const sx1 = this.s[right];
                            const sy0 = this.s[bottom];
                            const sy1 = this.s[top];
                            const s = sx0 + sx1 + sy0 + sy1;
                            if (s == 0.0) continue;
                            
                            let div = this.u[right] - this.u[center] + this.v[top] - this.v[center];
                            
                            if (this.particleRestDensity > 0.0 && compensateDrift) {
                                const k = 1.0;
                                const compression = this.particleDensity[i * n + j] - this.particleRestDensity;
                                if (compression > 0.0)
                                    div = div - k * compression;
                            }
                            
                            const p = -div / s * overRelaxation;
                            this.p[center] += cp * p;
                            this.u[center] -= sx0 * p;
                            this.u[right] += sx1 * p;
                            this.v[center] -= sy0 * p;
                            this.v[top] += sy1 * p;
                        }
                    }
                }
            }
            
            simulate(dt, gravity, flipRatio, numPressureIters, separateParticles) {
                this.integrateParticles(dt, gravity);
                this.handleParticleCollisions();
                this.transferVelocities(true);
                this.updateParticleDensity();
                this.solveIncompressibility(numPressureIters, dt, 1.9, true);
                this.transferVelocities(false, flipRatio);
            }
        }
        
        function setupFluid() {
            const res = 50;
            const tankHeight = simHeight;
            const tankWidth = simWidth;
            const h = tankHeight / res;
            const density = 1000.0;
            
            const relWaterHeight = 0.6;
            const relWaterWidth = 0.6;
            
            const r = 0.3 * h;
            const dx = 2.0 * r;
            const dy = Math.sqrt(3.0) / 2.0 * dx;
            
            const numX = Math.floor((relWaterWidth * tankWidth - 2.0 * h - 2.0 * r) / dx);
            const numY = Math.floor((relWaterHeight * tankHeight - 2.0 * h - 2.0 * r) / dy);
            const maxParticles = numX * numY;
            
            const fluid = new FlipFluid(density, tankWidth, tankHeight, h, r, maxParticles);
            
            fluid.numParticles = numX * numY;
            let p = 0;
            for (let i = 0; i < numX; i++) {
                for (let j = 0; j < numY; j++) {
                    fluid.particlePos[p++] = h + r + dx * i + (j % 2 == 0 ? 0.0 : r);
                    fluid.particlePos[p++] = h + r + dy * j;
                }
            }
            
            const n = fluid.fNumY;
            const centerX = fluid.fNumX / 2;
            const centerY = fluid.fNumY / 2;
            const maxDist = Math.min(centerX, centerY) - 1;
            
            for (let i = 0; i < fluid.fNumX; i++) {
                for (let j = 0; j < fluid.fNumY; j++) {
                    const dx = i - centerX;
                    const dy = j - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < maxDist) {
                        fluid.s[i * n + j] = 1.0;
                    } else {
                        fluid.s[i * n + j] = 0.0;
                    }
                }
            }
            
            console.log('Fluid створено. Частинок:', fluid.numParticles);
            return fluid;
        }
        
        function updateLEDs() {
            if (!scene.fluid) return;
            
            const displaySize = ledDisplay.offsetWidth;
            const n = scene.fluid.fNumY;
            const h = scene.fluid.h;
            
            leds.forEach(led => {
                const simX = (led.x / displaySize) * simWidth;
                const simY = (led.y / displaySize) * simHeight;
                
                const xi = clamp(Math.floor(simX / h), 0, scene.fluid.fNumX - 1);
                const yi = clamp(Math.floor(simY / h), 0, scene.fluid.fNumY - 1);
                const cellNr = xi * n + yi;
                
                const density = scene.fluid.particleDensity[cellNr];
                const isFluid = scene.fluid.cellType[cellNr] === FLUID_CELL;
                
                if (isFluid && density > 0.05) {
                    let intensity = density;
                    if (scene.fluid.particleRestDensity > 0) {
                        intensity = Math.min(density / scene.fluid.particleRestDensity, 2.0);
                    }
                    
                    const brightness = Math.floor(intensity * 255);
                    const r = Math.floor(clamp(brightness * 0.2, 0, 255));
                    const g = Math.floor(clamp(brightness * 0.9, 0, 255));
                    const b = Math.floor(clamp(brightness * 0.3, 0, 255));
                    
                    led.element.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
                    led.element.style.boxShadow = `0 0 ${6 + intensity * 4}px rgb(${r}, ${g}, ${b})`;
                } else {
                    led.element.style.backgroundColor = '#0f0f0f';
                    led.element.style.boxShadow = 'none';
                }
            });
        }
        
        function getMouseAngle(e) {
            const rect = pendant.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const mouseX = e.clientX || (e.touches && e.touches[0].clientX);
            const mouseY = e.clientY || (e.touches && e.touches[0].clientY);
            return Math.atan2(mouseY - centerY, mouseX - centerX);
        }
        
        pendant.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseAngle = getMouseAngle(e);
            angularVelocity = 0;
        });
        
        pendant.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastMouseAngle = getMouseAngle(e);
            angularVelocity = 0;
        });
        
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const currentAngle = getMouseAngle(e);
            let deltaAngle = currentAngle - lastMouseAngle;
            if (deltaAngle > Math.PI) deltaAngle -= 2 * Math.PI;
            if (deltaAngle < -Math.PI) deltaAngle += 2 * Math.PI;
            rotation += deltaAngle;
            angularVelocity = deltaAngle * 60;
            lastMouseAngle = currentAngle;
            pendant.style.transform = `rotate(${rotation}rad)`;
        });
        
        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const currentAngle = getMouseAngle(e);
            let deltaAngle = currentAngle - lastMouseAngle;
            if (deltaAngle > Math.PI) deltaAngle -= 2 * Math.PI;
            if (deltaAngle < -Math.PI) deltaAngle += 2 * Math.PI;
            rotation += deltaAngle;
            angularVelocity = deltaAngle * 60;
            lastMouseAngle = currentAngle;
            pendant.style.transform = `rotate(${rotation}rad)`;
        }, { passive: false });
        
        document.addEventListener('mouseup', () => { isDragging = false; });
        document.addEventListener('touchend', () => { isDragging = false; });
        
        const scene = {
            gravity: 9.81,
            dt: 1.0 / 60.0,
            flipRatio: 0.9,
            numPressureIters: 50,
            paused: false,
            fluid: null
        };
        
        function resetFluid() {
            scene.fluid = setupFluid();
            rotation = 0;
            angularVelocity = 0;
            pendant.style.transform = 'rotate(0rad)';
        }
        
        document.getElementById('pauseBtn').addEventListener('click', () => {
            scene.paused = !scene.paused;
            document.getElementById('pauseBtn').textContent = scene.paused ? '▶️ Старт' : '⏸️ Пауза';
        });
        
        document.getElementById('resetBtn').addEventListener('click', resetFluid);
        
        function update() {
            if (!scene.paused && scene.fluid) {
                if (!isDragging) {
                    angularVelocity *= 0.98;
                    rotation += angularVelocity * 0.016;
                    pendant.style.transform = `rotate(${rotation}rad)`;
                }
                
                scene.fluid.simulate(
                    scene.dt,
                    scene.gravity,
                    scene.flipRatio,
                    scene.numPressureIters,
                    true
                );
                
                updateLEDs();
            }
            
            requestAnimationFrame(update);
        }
        
        createLEDGrid();
        scene.fluid = setupFluid();
        update();
    </script>
</body>
</html>
